<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Sunless City</title>
<style>
  :root{
    --ink:#e8e2d4; --ink-dim:#9a9282; --ink-faint:#5d574c;
    --ground:#14120f; --panel:#1c1915; --line:#2e2a23;
    --gold:#c9a227; --serif:Georgia,"Iowan Old Style","Times New Roman",serif;

    --v-NARRATOR:#a9a394;
    --v-FLIN:#d8a657;
    --v-YOBMOT:#e39ac0;
    --v-GUBMUH:#7fb3d5;
    --v-MR_YTIDRUSBA:#8fc08f;
    --v-MRS_YTIDRUSBA:#c1a0dc;
    --v-YREKCAUQ:#dd8d70;
    --v-HTURTEHTERAPS:#6fc0b8;
    --v-PEOPLE:#b5a68c;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);
       font:16px/1.6 var(--serif);-webkit-font-smoothing:antialiased}

  header{padding:34px 24px 20px;text-align:center;border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:30px;letter-spacing:.16em;font-weight:400;text-transform:uppercase}
  header .by{margin:10px 0 0;color:var(--ink-dim);font-size:13px;letter-spacing:.1em}
  header .rule{width:60px;height:1px;background:var(--gold);margin:16px auto 14px;opacity:.7}
  .cast{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;
        font-size:12px;letter-spacing:.04em;color:var(--ink-faint)}
  .cast span{display:inline-flex;align-items:center;gap:6px}
  .cast i{width:9px;height:9px;border-radius:50%;display:inline-block}

  .wrap{display:grid;grid-template-columns:290px 1fr;min-height:60vh}
  nav{border-right:1px solid var(--line);padding:18px 0 60px;overflow-y:auto;
      max-height:calc(100vh - 260px);position:sticky;top:0}
  nav ol{list-style:none;margin:0;padding:0}
  nav li button{display:flex;gap:12px;width:100%;text-align:left;background:none;border:0;
      color:var(--ink-dim);font:14px/1.45 var(--serif);padding:9px 22px;cursor:pointer}
  nav li button:hover{color:var(--ink);background:var(--panel)}
  nav li button .num{color:var(--ink-faint);min-width:22px;text-align:right;
      font-variant-numeric:tabular-nums}
  nav li.on button{color:var(--gold);background:var(--panel);box-shadow:inset 3px 0 0 var(--gold)}
  nav li.done button .num::after{content:"\2713";color:var(--gold);margin-left:4px;font-size:11px}

  main{padding:26px 40px 150px;max-width:740px}
  h2{margin:0 0 4px;font-size:22px;font-weight:400;letter-spacing:.04em}
  .meta{color:var(--ink-faint);font-size:13px;margin:0 0 26px;letter-spacing:.06em}
    .stage{margin:0 0 28px;padding:12px;background:linear-gradient(180deg,#171410,#0d0c0a);
      border:1px solid var(--line);box-shadow:inset 0 0 0 1px rgba(255,255,255,.03);
      position:sticky;top:0;z-index:2}
    #viz{display:block;width:100%;aspect-ratio:16/9;height:auto;background:#090806;
      border:1px solid #29241c;image-rendering:pixelated;image-rendering:crisp-edges}
    #viz.ink{image-rendering:auto;background:#efe2c3;border-color:#1c1712}

  .blk{margin:0 0 1.15em}
  .blk .who{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
      margin:0 0 3px;opacity:.85}
  .blk .line{color:var(--ink-faint);transition:color .15s}
  .blk.speech .line{padding-left:14px;border-left:2px solid currentColor}
  .blk span.s{cursor:pointer}
  .blk span.s.cur{background:rgba(201,162,39,.16);box-shadow:0 0 0 3px rgba(201,162,39,.16);
      border-radius:2px;color:#fff}
  .blk.now .line{color:var(--ink-dim)}

  footer{position:fixed;left:0;right:0;bottom:0;background:rgba(20,18,15,.97);
     border-top:1px solid var(--line);backdrop-filter:blur(8px);padding:10px 20px}
  .bar{display:flex;align-items:center;gap:14px;max-width:1000px;margin:0 auto;flex-wrap:wrap}
  .bar button{background:none;border:1px solid var(--line);color:var(--ink);border-radius:4px;
     padding:7px 12px;cursor:pointer;font:13px var(--serif)}
  .bar button:hover{border-color:var(--gold);color:var(--gold)}
  .bar button.play{min-width:72px;border-color:var(--gold);color:var(--gold)}
  .bar .now-title{flex:1;min-width:150px;color:var(--ink-dim);font-size:13px;
     white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .speaking{font-size:12px;letter-spacing:.1em;text-transform:uppercase;min-width:90px}
  .bar .time{color:var(--ink-faint);font-size:12px;font-variant-numeric:tabular-nums}
  input[type=range]{accent-color:var(--gold)}
  #seek{flex-basis:100%;width:100%;margin:0}
  select{background:var(--panel);color:var(--ink);border:1px solid var(--line);
     border-radius:4px;padding:6px;font:13px var(--serif)}

  @media (max-width:760px){
    .wrap{grid-template-columns:1fr}
    nav{position:static;max-height:230px;border-right:0;border-bottom:1px solid var(--line)}
    main{padding:22px 18px 180px}
  }
</style>
</head>
<body>
<header>
  <h1>The Sunless City</h1>
  <p class="by">J. E. Preston Muddock &middot; 1905</p>
  <div class="rule"></div>
  <div class="cast" id="cast"></div>
</header>

<div class="wrap">
  <nav><ol id="toc"></ol></nav>
  <main>
    <h2 id="ct">&nbsp;</h2>
    <p class="meta" id="cm"></p>
    <div class="stage">
      <canvas id="viz" width="96" height="54" aria-hidden="true"></canvas>
    </div>
    <div id="script"></div>
  </main>
</div>

<footer>
  <div class="bar">
    <button class="play" id="play">Play</button>
    <button id="prev">&#8592; Prev</button>
    <button id="next">Next &#8594;</button>
    <button id="b15">&#8630; 15s</button>
    <button id="f15">15s &#8631;</button>
    <span class="now-title" id="nt"></span>
    <span class="speaking" id="sp"></span>
    <select id="rate">
      <option value="0.75">0.75&times;</option>
      <option value="1" selected>1&times;</option>
      <option value="1.25">1.25&times;</option>
      <option value="1.5">1.5&times;</option>
      <option value="1.75">1.75&times;</option>
      <option value="2">2&times;</option>
    </select>
    <span class="time" id="tm">0:00 / 0:00</span>
    <input type="range" id="seek" min="0" max="1000" value="0">
  </div>
</footer>

<audio id="au" preload="metadata"></audio>

<script>
const KEY = "sunlesscity.progress";
const NAMES = {
  NARRATOR: "Narrator",
  FLIN: "Flin Flon",
  YOBMOT: "Princess Yobmot",
  GUBMUH: "King Gubmuh",
  MR_YTIDRUSBA: "Mr. Ytidrusba",
  MRS_YTIDRUSBA: "Mrs. Ytidrusba",
  YREKCAUQ: "Doctor Yrekcauq",
  HTURTEHTERAPS: "Hturtehteraps",
  PEOPLE: "The people"
};

const au = document.getElementById("au");
const viz = document.getElementById("viz");
const vx = viz.getContext("2d", {alpha: false});
let chapters = [], scenes = {}, cur = 0, cues = [], cueIdx = -1;
const vizState = {flash: 0, lastCue: -2, lastScene: ""};
const pad = n => String(n).padStart(2, "0");
const colour = v => "var(--v-" + v + ")";
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
const fmt = s => {
  if (!isFinite(s)) return "0:00";
  s = Math.floor(s);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h ? h + ":" + pad(m) + ":" + pad(s % 60) : m + ":" + pad(s % 60);
};
const mix = (a, b, t) => a + (b - a) * t;
const hexToRgb = hex => {
  const clean = hex.replace("#", "").trim();
  const full = clean.length === 3
    ? clean.split("").map(ch => ch + ch).join("")
    : clean;
  return [0, 1, 2].map(i => parseInt(full.slice(i * 2, i * 2 + 2), 16));
};
const tint = (base, amount, target) =>
  base.map((value, i) => Math.round(mix(value, target[i], amount)));
const rgba = (rgb, alpha = 1) => "rgba(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + "," + alpha + ")";
const voiceRgb = voice => {
  const raw = getComputedStyle(document.documentElement)
    .getPropertyValue("--v-" + voice).trim() || "#c9a227";
  return hexToRgb(raw);
};
const wrap = (value, size) => ((value % size) + size) % size;

function rect(x, y, w, h, color){
  vx.fillStyle = color;
  vx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}

function pixelCircle(x, y, r, color){
  vx.fillStyle = color;
  for (let py = -r; py <= r; py++){
    for (let px = -r; px <= r; px++){
      if (px * px + py * py <= r * r) vx.fillRect(x + px, y + py, 1, 1);
    }
  }
}

function sceneAt(){
  if (!chapters.length) return {id: "cavern", hits: {}, characters: []};
  const list = scenes[chapters[cur].n];
  let k = 0;
  for (let i = 0; i < list.length; i++){
    if (list[i].cue > cueIdx) break;
    k = i;
  }
  const scene = list[k];
  const hits = {};
  for (const f of scene.flags) hits[f] = true;
  return {id: scene.id, hits, characters: scene.characters, note: scene.note, cue: scene.cue, next: list[k + 1] || null};
}

function drawPeak(cx, baseY, width, height, color){
  vx.fillStyle = color;
  for (let dx = -width; dx <= width; dx++){
    const ratio = 1 - Math.abs(dx) / Math.max(1, width);
    const span = Math.max(1, Math.round(height * ratio));
    vx.fillRect(cx + dx, baseY - span, 1, span);
  }
}

function drawWater(top, amp, fill, crest, drift){
  for (let x = 0; x < viz.width; x++){
    const wave = Math.round(Math.sin(x * .3 + drift) * amp);
    const y = top + wave;
    rect(x, y, 1, viz.height - y, fill);
    if (x % 2 === 0) rect(x, y, 1, 1, crest);
  }
}

function drawGem(cx, cy, size, body, shine){
  vx.fillStyle = body;
  for (let dy = -size; dy <= size; dy++){
    const span = size - Math.abs(dy);
    vx.fillRect(cx - span, cy + dy, span * 2 + 1, 1);
  }
  rect(cx, cy - size + 1, 1, 2, shine);
  rect(cx - 1, cy, 3, 1, shine);
}

function drawBubble(cx, cy, r, color){
  pixelCircle(cx, cy, r, color);
  rect(cx - 1, cy - 1, 1, 1, rgba([255, 255, 255], .55));
}

function drawFigure(x, baseY, body, head){
  pixelCircle(x, baseY - 9, 2, head);
  rect(x - 1, baseY - 7, 3, 5, body);
  rect(x - 3, baseY - 5, 7, 1, body);
  rect(x - 2, baseY - 2, 1, 3, body);
  rect(x + 1, baseY - 2, 1, 3, body);
}

function drawCrown(cx, baseY, body, shine){
  rect(cx - 8, baseY - 2, 16, 3, body);
  drawPeak(cx - 5, baseY - 2, 2, 6, body);
  drawPeak(cx, baseY - 2, 2, 8, body);
  drawPeak(cx + 5, baseY - 2, 2, 6, body);
  rect(cx - 5, baseY - 7, 1, 1, shine);
  rect(cx, baseY - 9, 1, 1, shine);
  rect(cx + 5, baseY - 7, 1, 1, shine);
}

function drawFrame(accent, pale){
  vx.strokeStyle = rgba(tint(accent, .22, pale), .9);
  vx.strokeRect(.5, .5, viz.width - 1, viz.height - 1);
}

function drawStars(count, drift, color){
  for (let i = 0; i < count; i++){
    const x = wrap(Math.floor(i * 11 + drift * (1 + (i % 3) * .12)), viz.width);
    const y = 4 + ((i * 7 + cur * 3) % 18);
    rect(x, y, 1, 1, color);
  }
}

function drawCurtains(shadow, accent){
  rect(0, 0, 10, viz.height, rgba(shadow));
  rect(viz.width - 10, 0, 10, viz.height, rgba(shadow));
  for (let y = 0; y < viz.height; y += 4){
    rect(0, y, 10, 1, rgba(accent, .22));
    rect(viz.width - 10, y, 10, 1, rgba(accent, .22));
  }
}

function drawCharacters(ids, sceneId, activeVoice, accent, pulse){
  if (!ids.length) return;
  const positions = ids.length === 1 ? [48] : ids.length === 2 ? [34, 62] : [22, 48, 74];
  const baseYByScene = {
    water: 38,
    river: 37,
    forest: 41,
    palace: 42,
    hall: 42,
    court: 42,
    city: 42,
    chamber: 42,
    storm: 41,
    fire: 40,
    bridge: 29,
    cavern: 41
  };
  const baseY = baseYByScene[sceneId] || 41;

  ids.forEach((id, index) => {
    const x = positions[index];
    const bob = Math.round(Math.sin(index + pulse * Math.PI) * .8);
    const bodyRgb = voiceRgb(id);
    const body = rgba(bodyRgb);
    const shade = rgba(tint(bodyRgb, .35, [0, 0, 0]));
    const skin = rgba(tint(bodyRgb, .68, [238, 226, 204]));
    const active = id === activeVoice;

    if (active) pixelCircle(x, baseY - 10, 6, rgba(bodyRgb, .18));
    pixelCircle(x, baseY - 10 + bob, id === "GUBMUH" ? 3 : 2, skin);

    if (id === "YOBMOT" || id === "MRS_YTIDRUSBA"){
      drawPeak(x, baseY + 1, 4, 8, body);
      rect(x - 3, baseY - 4 + bob, 7, 1, body);
    } else {
      rect(x - 1, baseY - 8 + bob, 3, 7, body);
      rect(x - 3, baseY - 6 + bob, 7, 1, body);
      rect(x - 2, baseY - 1 + bob, 1, 3, shade);
      rect(x + 1, baseY - 1 + bob, 1, 3, shade);
    }

    if (id === "GUBMUH") drawCrown(x, baseY - 9 + bob, rgba(tint(bodyRgb, .35, [201, 162, 39])), rgba(tint(bodyRgb, .7, [255, 241, 196])));
    if (id === "MR_YTIDRUSBA" || id === "YREKCAUQ") rect(x + 4, baseY - 7 + bob, 1, 9, rgba(tint(bodyRgb, .42, [220, 210, 180])));
    if (id === "FLIN") rect(x - 2, baseY - 14 + bob, 5, 2, rgba(tint(bodyRgb, .3, [40, 32, 24])));
    if (id === "HTURTEHTERAPS") rect(x - 4, baseY - 5 + bob, 2, 5, rgba(tint(bodyRgb, .28, [245, 245, 230])));
    if (active){
      rect(x - 2, baseY - 16 + bob, 5, 2, rgba(tint(bodyRgb, .55, [255, 247, 206])));
      rect(x + 3, baseY - 15 + bob, 2, 1, rgba(tint(bodyRgb, .55, [255, 247, 206])));
    }
  });
}

function drawScene(scene, characters, t, pulse, drift, cueProgress, accent, pale, warm, deep, stone, shadow, spark, intensity){
  const w = viz.width;
  const h = viz.height;
  for (let y = 0; y < h; y++){
    const band = y / h;
    const row = tint(deep, .08 + (1 - band) * .18, y < 24 ? accent : [14, 12, 10]);
    rect(0, y, w, 1, rgba(y % 2 ? tint(row, .12, [0, 0, 0]) : row));
  }

  switch (scene.id){
    case "water": {
      drawPeak(16, 30, 16, 17, rgba(stone));
      drawPeak(44, 28, 20, 19, rgba(shadow));
      drawPeak(76, 29, 18, 15, rgba(stone));
      pixelCircle(74, 11, 6 + Math.round(pulse * 2), rgba(spark, .9));
      drawWater(33, 2 + intensity, rgba(tint(stone, .18, accent)), rgba(pale, .45), drift * 1.4);
      if (scene.hits.city){
        for (let i = 0; i < 5; i++) rect(8 + i * 15, 22 - (i % 2) * 4, 8, 11 + (i % 3) * 2, rgba(shadow, .9));
      }
      if (characters.includes("FLIN")){
        rect(22, 31, 20, 2, rgba(shadow));
        drawPeak(30, 31, 4, 5, rgba(warm));
      }
      break;
    }
    case "river": {
      rect(0, 0, 18, h, rgba(shadow));
      rect(78, 0, 18, h, rgba(shadow));
      for (let i = 0; i < 4; i++) drawPeak(10 + i * 22, 18, 6, 8 + (i % 2) * 5, rgba(stone));
      for (let y = 12; y < h; y++){
        const mid = 46 + Math.sin(y * .18 + drift) * 11;
        rect(mid - 8, y, 16, 1, rgba(tint(accent, .24, [48, 80, 92])));
      }
      break;
    }
    case "forest": {
      rect(0, 34, w, 20, rgba(tint(stone, .18, [72, 68, 61])));
      for (let i = 0; i < 8; i++){
        const x = 6 + i * 11;
        rect(x, 12 + (i % 3), 4, 24, rgba(tint(stone, .12, [118, 109, 95])));
        rect(x - 1, 11 + (i % 3), 6, 2, rgba(pale, .18));
      }
      if (scene.hits.water) drawWater(39, 1 + pulse, rgba(tint(accent, .18, [68, 85, 94])), rgba(pale, .35), drift * 1.1);
      break;
    }
    case "palace": {
      drawCurtains(shadow, accent);
      rect(12, 34, 72, 20, rgba(tint(stone, .12, [94, 78, 52])));
      rect(18, 10, 8, 24, rgba(tint(stone, .18, [145, 132, 116])));
      rect(70, 10, 8, 24, rgba(tint(stone, .18, [145, 132, 116])));
      rect(34, 20, 28, 6, rgba(tint(stone, .14, [132, 110, 78])));
      if (scene.hits.palace || scene.hits.furniture){
        rect(39, 14, 18, 6, rgba(tint(warm, .16, stone)));
        rect(42, 10, 12, 5, rgba(shadow));
      }
      if (scene.hits.jewels) for (let i = 0; i < 3; i++) drawGem(28 + i * 20, 18, 3, rgba(i % 2 ? warm : accent), rgba(spark));
      break;
    }
    case "hall": {
      rect(0, 39, w, 15, rgba(stone));
      rect(30, 20, 36, 6, rgba(tint(stone, .16, [110, 90, 62])));
      rect(40, 17, 16, 3, rgba(shadow));
      for (let i = 0; i < 8; i++) pixelCircle(8 + i * 11, 43 + (i % 2), 2, rgba(shadow));
      rect(46, 23, 4, 10, rgba(pale, .5));
      rect(34, 29, 28, 2, rgba(shadow));
      break;
    }
    case "court": {
      rect(0, 40, w, 14, rgba(stone));
      rect(12, 18, 72, 2, rgba(pale, .45));
      rect(44, 14, 8, 20, rgba(shadow));
      rect(32, 24, 10, 5, rgba(shadow));
      rect(54, 24, 10, 5, rgba(shadow));
      rect(47, 12, 2, 10, rgba(warm));
      rect(41, 20, 14, 2, rgba(warm));
      break;
    }
    case "city": {
      rect(0, 39, w, 15, rgba(stone));
      for (let i = 0; i < 7; i++){
        const x = 4 + i * 13;
        const buildingH = 9 + (i % 3) * 6;
        rect(x, 39 - buildingH, 10, buildingH, rgba(shadow));
        rect(x + 2, 39 - buildingH + 3, 1, 1, rgba(spark, .6));
        rect(x + 6, 39 - buildingH + 6, 1, 1, rgba(spark, .45));
      }
      if (scene.hits.crowd) for (let i = 0; i < 6; i++) rect(9 + i * 14, 18, 1, 11, rgba(pale, .6));
      if (scene.hits.city) for (let i = 0; i < 6; i++) drawPeak(12 + i * 14 + Math.sin(t + i) * 2, 18, 4, 5, rgba(i % 2 ? accent : warm));
      break;
    }
    case "chamber": {
      rect(0, 34, w, 20, rgba(tint(stone, .12, [78, 64, 44])));
      rect(12, 12, 72, 22, rgba(tint(stone, .16, [94, 82, 66])));
      rect(20, 22, 20, 6, rgba(shadow));
      rect(58, 26, 12, 4, rgba(shadow));
      if (scene.hits.furniture) rect(52, 20, 18, 3, rgba(tint(warm, .16, stone)));
      break;
    }
    case "storm": {
      rect(0, 18, w, 36, rgba(shadow));
      for (let i = 0; i < 4; i++) pixelCircle(18 + i * 20, 16 + (i % 2), 6, rgba(tint(stone, .12, pale), .7));
      const bolt = vizState.flash > .5 ? spark : warm;
      rect(48, 14, 2, 10, rgba(bolt));
      rect(46, 22, 6, 2, rgba(bolt));
      rect(44, 24, 2, 9, rgba(bolt));
      rect(42, 31, 7, 2, rgba(bolt));
      break;
    }
    case "fire": {
      rect(0, 32, w, 22, rgba(tint(warm, .16, [68, 18, 8])));
      drawWater(34, 3 + pulse * 2, rgba(tint(warm, .18, [180, 58, 12])), rgba(spark, .55), drift * 2.8);
      for (let i = 0; i < 6; i++) drawPeak(10 + i * 15, 34, 3, 6 + ((i + cur) % 3) * 3 + pulse * 4, rgba(warm));
      break;
    }
    case "bridge": {
      drawPeak(18, 36, 16, 16, rgba(stone));
      drawPeak(78, 36, 16, 16, rgba(stone));
      rect(24, 28, 48, 3, rgba(tint(warm, .16, stone)));
      for (let i = 0; i < 5; i++) rect(28 + i * 9, 31, 2, 7, rgba(tint(warm, .1, stone)));
      break;
    }
    case "cavern":
    default: {
      for (let i = 0; i < 7; i++){
        const x = wrap(Math.floor(i * 17 - drift * (.6 + i * .03)), w + 10) - 5;
        const top = 8 + ((cur * 11 + i * 13) % 12);
        const bottom = 30 + ((cur * 7 + i * 9) % 14);
        rect(x, 0, 4 + (i % 3), top, rgba(tint(stone, .12, [0, 0, 0])));
        rect(x + 1, bottom, 3 + (i % 2), h - bottom - 5, rgba(tint(stone, .12, [0, 0, 0])));
      }
      if (scene.hits.water || scene.hits.river) drawWater(34, 2 + intensity, rgba(tint(stone, .18, accent)), rgba(pale, .45), drift * 1.4);
      if (scene.hits.jewels) [[18, 35], [33, 29], [48, 37], [62, 31], [78, 39]].forEach(([x, y], i) =>
        drawGem(x, y, 4 + (i % 2), rgba(i % 2 ? accent : warm), rgba(spark)));
      drawStars(10, drift * .5, rgba(spark, .6));
      break;
    }
  }

  if (scene.hits.jewels && scene.id !== "cavern" && scene.id !== "palace"){
    for (let i = 0; i < 3; i++) drawGem(24 + i * 22, 18 + (i % 2) * 5, 3, rgba(i % 2 ? accent : warm), rgba(spark));
  }
  if (scene.hits.crowd && (scene.id === "hall" || scene.id === "city" || scene.id === "court")){
    for (let i = 0; i < 8; i++) pixelCircle(8 + i * 11, 43 + (i % 2), 2, rgba(shadow));
  }
}

// ---- Chapter 2 is drawn as a 1905 Sunday-supplement page: black ink, flat colour plates, a caption strip ----
const INK = {
  paper: "#efe2c3", line: "#1c1712", red: "#c6432c", yellow: "#e9b92f", blue: "#3b78a6",
  dawn: "#f3d58a", sky: "#a9cfe0", coat: "#6d8a4a", copper: "#c8722f", brass: "#d9a441",
  iron: "#6b6f74", purple: "#7b4d8b", flesh: "#f1cfa6", white: "#f8f2e4", night: "#22304f",
  brick: "#b8674a", stone: "#c9b48e", slate: "#7d8ea0", wood: "#8b5a2b", cloth: "#f4efe2",
  trousers: "#3d3f4c", curtain: "#8f2f2a", wall: "#d8c39a", gold: "#c9a227"
};
// The colour plates sit a hair off the black plate, as they did on a printed page
const REG = [3, 2];
const INK_W = 960, INK_H = 540;
let inkPaper = null;

const P = {
  rect: (x, y, w, h) => g => g.rect(x, y, w, h),
  round: (x, y, w, h, r) => g => g.roundRect(x, y, w, h, r),
  ellipse: (cx, cy, rx, ry) => g => g.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2),
  poly: pts => g => { pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); },
  line: pts => g => pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y))
};

function inkPaperPattern(){
  if (inkPaper) return inkPaper;
  const c = document.createElement("canvas");
  c.width = c.height = 6;
  const g = c.getContext("2d");
  g.fillStyle = INK.paper;
  g.fillRect(0, 0, 6, 6);
  g.fillStyle = "rgba(90,70,40,.09)";
  g.fillRect(2, 2, 1, 1);
  g.fillRect(5, 0, 1, 1);
  inkPaper = vx.createPattern(c, "repeat");
  return inkPaper;
}

function inkShape(path, fill, opts = {}){
  if (fill){
    vx.save();
    vx.translate(REG[0], REG[1]);
    vx.beginPath();
    path(vx);
    vx.fillStyle = fill;
    vx.fill();
    vx.restore();
  }
  if (opts.stroke === false) return;
  vx.beginPath();
  path(vx);
  vx.lineWidth = opts.width === undefined ? 3 : opts.width;
  vx.strokeStyle = opts.ink || INK.line;
  vx.lineJoin = "round";
  vx.lineCap = "round";
  vx.stroke();
}

function inkFlat(x, y, w, h, color){
  vx.fillStyle = color;
  vx.fillRect(x, y, w, h);
}

function inkWrap(text, maxWidth, font){
  vx.font = font;
  const lines = [];
  let line = "";
  for (const word of text.split(" ")){
    const test = line ? line + " " + word : word;
    if (vx.measureText(test).width > maxWidth && line){
      lines.push(line);
      line = word;
    } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

function inkLetter(text, x, y, size, opts = {}){
  vx.font = (opts.weight || "bold") + " " + size + "px Georgia, serif";
  vx.textAlign = opts.align || "center";
  vx.textBaseline = "middle";
  vx.fillStyle = opts.color || INK.line;
  vx.fillText(text.toUpperCase(), x, y);
}

// Flin Flon: a giant's head on a body like a length of gaspipe, pendulum arms, corkscrew legs,
// spectacles, bald, an old green coat buttoned to the chin and a broad-brimmed hat out of doors
function drawFlin(x, ground, s, o = {}){
  const headY = ground - 172 * s;
  const bodyTop = ground - 126 * s;
  const bodyBot = ground - 48 * s;
  const bw = 22 * s;
  for (const side of [-1, 1]){
    const lx = x + side * 8 * s;
    inkShape(g => {
      g.moveTo(lx, bodyBot);
      for (let i = 1; i <= 7; i++) g.lineTo(lx + (i % 2 ? 7 : -7) * s, bodyBot + i * 6 * s);
      g.lineTo(lx, ground - 3 * s);
    }, null, {width: 3 * s + 1});
    inkShape(P.ellipse(lx + side * 4 * s, ground - 3 * s, 12 * s, 4 * s), INK.line, {width: 2});
  }
  inkShape(P.round(x - bw / 2, bodyTop, bw, bodyBot - bodyTop, 8 * s), INK.coat);
  for (let i = 0; i < 6; i++)
    inkShape(P.ellipse(x, bodyTop + 10 * s + i * 12 * s, 2.2 * s, 2.2 * s), INK.line, {width: 1});
  for (const side of [-1, 1]){
    const ax = x + side * bw / 2;
    const swing = (o.swing || 0) * side * s;
    const raised = o.point === side;
    const hx = raised ? ax + side * 40 * s : ax + side * 6 * s + swing;
    const hy = raised ? bodyTop - 10 * s : ground - 30 * s;
    inkShape(P.line([[ax, bodyTop + 8 * s], [hx, hy]]), null, {width: 4 * s + 1});
    inkShape(P.ellipse(hx, hy, 5 * s, 6 * s), INK.flesh, {width: 2});
  }
  inkShape(P.rect(x - 5 * s, headY + 38 * s, 10 * s, 14 * s), INK.flesh, {width: 2});
  inkShape(P.ellipse(x, headY, 34 * s, 42 * s), INK.flesh);
  inkShape(P.ellipse(x - 34 * s, headY + 4 * s, 6 * s, 9 * s), INK.flesh, {width: 2});
  inkShape(P.ellipse(x + 34 * s, headY + 4 * s, 6 * s, 9 * s), INK.flesh, {width: 2});
  const ey = headY - 2 * s;
  inkShape(P.ellipse(x - 13 * s, ey, 11 * s, 9 * s), INK.white, {width: 2.5});
  inkShape(P.ellipse(x + 13 * s, ey, 11 * s, 9 * s), INK.white, {width: 2.5});
  inkShape(P.line([[x - 2 * s, ey], [x + 2 * s, ey]]), null, {width: 2.5});
  inkShape(P.line([[x - 24 * s, ey - 2 * s], [x - 33 * s, ey + 2 * s]]), null, {width: 2});
  inkShape(P.line([[x + 24 * s, ey - 2 * s], [x + 33 * s, ey + 2 * s]]), null, {width: 2});
  const look = (o.look || 0) * 3 * s;
  inkShape(P.ellipse(x - 13 * s + look, ey, 2.6 * s, 2.6 * s), INK.line, {width: 1});
  inkShape(P.ellipse(x + 13 * s + look, ey, 2.6 * s, 2.6 * s), INK.line, {width: 1});
  inkShape(P.line([[x, ey + 4 * s], [x + 3 * s, ey + 16 * s], [x - 2 * s, ey + 17 * s]]), null, {width: 2});
  if (o.talking) inkShape(P.ellipse(x, ey + 28 * s, 7 * s, 4 * s), INK.line, {width: 2});
  else inkShape(P.line([[x - 9 * s, ey + 27 * s], [x, ey + 30 * s], [x + 9 * s, ey + 27 * s]]), null, {width: 2});
  inkShape(P.ellipse(x + 12 * s, ey + 31 * s, 2 * s, 2 * s), INK.line, {width: 1});
  inkShape(P.line([[x + 12 * s, ey + 31 * s], [x + 17 * s, ey + 25 * s]]), null, {width: 1, ink: "#8a8a8a"});
  inkShape(P.line([[x + 12 * s, ey + 31 * s], [x + 19 * s, ey + 29 * s]]), null, {width: 1, ink: "#8a8a8a"});
  inkShape(P.ellipse(x - 13 * s, ey + 12 * s, 1.4 * s, 1.4 * s), INK.red, {width: 1});
  inkShape(P.line([[x - 14 * s, headY - 28 * s], [x - 5 * s, headY - 35 * s]]), null, {width: 2, ink: INK.white});
  if (o.hat){
    inkShape(P.ellipse(x, headY - 30 * s, 58 * s, 9 * s), INK.line);
    inkShape(P.round(x - 26 * s, headY - 62 * s, 52 * s, 34 * s, 6 * s), INK.line);
  }
  return [x, headY - (o.hat ? 66 : 44) * s];
}

function drawGent(x, ground, s, o = {}){
  const coat = o.coat || INK.line;
  inkShape(P.rect(x - 9 * s, ground - 40 * s, 7 * s, 40 * s), INK.trousers, {width: 2});
  inkShape(P.rect(x + 2 * s, ground - 40 * s, 7 * s, 40 * s), INK.trousers, {width: 2});
  inkShape(P.poly([[x - 16 * s, ground - 36 * s], [x - 14 * s, ground - 95 * s], [x + 14 * s, ground - 95 * s], [x + 16 * s, ground - 36 * s]]), coat);
  inkShape(P.poly([[x - 5 * s, ground - 95 * s], [x + 5 * s, ground - 95 * s], [x + 3 * s, ground - 70 * s], [x - 3 * s, ground - 70 * s]]), INK.white, {width: 1.5});
  if (o.paper){
    const px = x + 20 * s, py = ground - 120 * s + o.paper * 10 * s;
    inkShape(P.line([[x + 12 * s, ground - 88 * s], [px, py + 8 * s]]), null, {width: 3 * s + 1});
    inkShape(P.rect(px - 10 * s, py - 12 * s, 20 * s, 26 * s), INK.white, {width: 2});
    for (let i = 0; i < 4; i++) inkShape(P.line([[px - 6 * s, py - 6 * s + i * 5 * s], [px + 6 * s, py - 6 * s + i * 5 * s]]), null, {width: 1});
  }
  inkShape(P.ellipse(x, ground - 108 * s, 12 * s, 14 * s), INK.flesh, {width: 2});
  if (o.beard) inkShape(P.ellipse(x, ground - 100 * s, 9 * s, 7 * s), o.beard, {width: 1.5});
  inkShape(P.rect(x - 11 * s, ground - 142 * s, 22 * s, 24 * s), INK.line, {width: 2});
  inkShape(P.rect(x - 17 * s, ground - 120 * s, 34 * s, 4 * s), INK.line, {width: 2});
}

function drawLady(x, ground, s, o = {}){
  inkShape(P.poly([[x - 30 * s, ground], [x + 30 * s, ground], [x + 12 * s, ground - 80 * s], [x - 12 * s, ground - 80 * s]]), o.gown || INK.red);
  inkShape(P.ellipse(x, ground - 95 * s, 11 * s, 13 * s), INK.flesh, {width: 2});
  inkShape(P.ellipse(x, ground - 108 * s, 11 * s, 7 * s), o.hair || "#5a3a1e", {width: 2});
  if (o.jewel !== undefined){
    const tw = Math.sin(o.jewel) > .6;
    inkShape(P.ellipse(x, ground - 84 * s, 2.5 * s, 2.5 * s), tw ? INK.white : INK.blue, {width: 1});
    if (tw) for (let i = 0; i < 4; i++){
      const a = i * Math.PI / 2 + Math.PI / 4;
      inkShape(P.line([[x + Math.cos(a) * 4 * s, ground - 84 * s + Math.sin(a) * 4 * s], [x + Math.cos(a) * 9 * s, ground - 84 * s + Math.sin(a) * 9 * s]]), null, {width: 1.5});
    }
  }
}

// Flin's fish: a copper pike, plate glass eyes with lamps in them, paddle wheels at the belly
function drawFish(cx, cy, L, o = {}){
  const R = L * .13;
  const body = g => {
    g.moveTo(cx + L / 2, cy);
    g.bezierCurveTo(cx + L * .3, cy - R * 1.15, cx - L * .1, cy - R * 1.1, cx - L * .32, cy - R * .4);
    g.lineTo(cx - L * .5, cy - R * .9);
    g.lineTo(cx - L * .44, cy);
    g.lineTo(cx - L * .5, cy + R * .9);
    g.lineTo(cx - L * .32, cy + R * .4);
    g.bezierCurveTo(cx - L * .1, cy + R * 1.1, cx + L * .3, cy + R * 1.15, cx + L / 2, cy);
    g.closePath();
  };
  const built = o.built === undefined ? 1 : o.built;
  if (built < 1){
    vx.save();
    vx.beginPath();
    body(vx);
    vx.lineWidth = 3;
    vx.stroke();
    vx.clip();
    for (let i = 0; i < 9; i++){
      const rx = cx - L * .5 + i * L * .11;
      inkShape(P.line([[rx, cy - R * 1.3], [rx, cy + R * 1.3]]), null, {width: 3, ink: INK.iron});
    }
    inkShape(P.line([[cx - L * .5, cy], [cx + L * .5, cy]]), null, {width: 4, ink: INK.iron});
    vx.restore();
    vx.save();
    vx.beginPath();
    vx.rect(cx + L / 2 - built * L, cy - R * 2, built * L + 10, R * 4);
    vx.clip();
  }
  inkShape(body, INK.copper);
  for (let i = 0; i < 12; i++) for (let j = 0; j < 3; j++){
    const px = cx - L * .28 + i * L * .058, py = cy - R * .5 + j * R * .5;
    inkShape(P.ellipse(px, py, 1.6, 1.6), null, {width: 1});
  }
  inkShape(P.poly([[cx - L * .06, cy - R * .8], [cx + L * .02, cy - R * 1.5], [cx + L * .14, cy - R * .85]]), INK.copper);
  const gx = cx + L * .3;
  inkShape(P.line([[gx, cy - R * .5], [gx - L * .02, cy + R * .5]]), null, {width: 3});
  inkShape(P.line([[gx + L * .03, cy - R * .5], [gx + L * .01, cy + R * .5]]), null, {width: 3});
  const ex = cx + L * .41, er = R * .28;
  const lit = o.lamp || 0;
  if (lit > 0){
    vx.fillStyle = "rgba(233,185,47," + (lit * .45) + ")";
    vx.beginPath();
    vx.ellipse(ex, cy - R * .25, er * 2.4, er * 2.4, 0, 0, Math.PI * 2);
    vx.fill();
  }
  inkShape(P.ellipse(ex, cy - R * .25, er, er), lit > .5 ? INK.yellow : INK.white, {width: 2.5});
  inkShape(P.ellipse(ex, cy - R * .25, er * .35, er * .35), INK.line, {width: 1});
  inkShape(P.line([[cx + L * .5, cy], [cx + L * .38, cy + R * .35]]), null, {width: 3});
  if (o.wheel){
    const wx = cx, wy = cy + R * 1.0, wr = R * .45;
    inkShape(P.ellipse(wx, wy, wr, wr), INK.brass, {width: 2.5});
    for (let i = 0; i < 6; i++){
      const a = i * Math.PI / 3 + (o.spin || 0);
      inkShape(P.line([[wx, wy], [wx + Math.cos(a) * wr, wy + Math.sin(a) * wr]]), null, {width: 2});
    }
  }
  if (built < 1) vx.restore();
}

function drawBalloon(text, tipX, tipY, area){
  const font = "bold 19px Georgia, serif";
  const lines = inkWrap(text, 320, font).slice(0, 4);
  if (lines.length === 4) lines[3] = lines[3].replace(/\s*\S*$/, "") + " …";
  vx.font = font;
  const tw = Math.max(...lines.map(l => vx.measureText(l).width));
  const w = tw + 36, h = lines.length * 24 + 24;
  const bx = clamp(tipX - w / 2, area.x + 10, area.x + area.w - w - 10);
  // A speaker near the top of the panel gets the balloon underneath, so it does not
  // cover the scene above them.
  const below = tipY - h - 34 < area.y + 10;
  const by = below ? Math.min(tipY + 34, area.y + area.h - h - 10) : tipY - h - 34;
  inkShape(P.round(bx, by, w, h, 18), INK.white, {width: 3});
  const tx = clamp(tipX, bx + 30, bx + w - 30);
  const edge = below ? by + 1 : by + h - 1;
  inkShape(P.poly([[tx - 14, edge], [tx + 10, edge], [tipX, tipY + (below ? 6 : -6)]]), INK.white, {width: 3});
  inkFlat(tx - 12, below ? by - 2 : by + h - 4, 20, 6, INK.white);
  vx.font = font;
  vx.textAlign = "center";
  vx.textBaseline = "middle";
  vx.fillStyle = INK.line;
  lines.forEach((l, i) => vx.fillText(l, bx + w / 2, by + 22 + i * 24));
}

function inkCityMorning(a, sp, t, pulse){
  const ground = a.y + a.h - 34;
  inkFlat(a.x, a.y, a.w, a.h, INK.dawn);
  const sunX = a.x + a.w * .5, sunY = ground - 230 - sp * (a.h - 330);
  for (let i = 0; i < 16; i++){
    const ang = i * Math.PI / 8 + t * .04;
    const r2 = 110 + (i % 2) * 30;
    inkShape(P.line([[sunX + Math.cos(ang) * 72, sunY + Math.sin(ang) * 72], [sunX + Math.cos(ang) * r2, sunY + Math.sin(ang) * r2]]), null, {width: 3});
  }
  inkShape(P.ellipse(sunX, sunY, 60, 60), INK.yellow, {width: 4});
  const blocks = [[-10, 200, INK.brick], [100, 262, INK.stone], [212, 330, INK.slate], [318, 226, INK.brick],
    [420, 170, INK.stone], [536, 250, INK.slate], [640, 300, INK.brick], [752, 214, INK.stone], [856, 282, INK.slate]];
  for (const [bx, bh, col] of blocks){
    const bw = 104;
    inkShape(P.rect(a.x + bx, ground - bh, bw, bh), col);
    inkShape(P.rect(a.x + bx - 5, ground - bh - 8, bw + 10, 10), INK.line, {width: 2});
    for (let r = 0; r < Math.floor((bh - 20) / 46); r++) for (let c = 0; c < 3; c++)
      inkShape(P.rect(a.x + bx + 13 + c * 30, ground - bh + 20 + r * 46, 18, 26), INK.white, {width: 2});
  }
  inkShape(P.rect(a.x - 5, ground, a.w + 10, 44), INK.stone, {width: 3});
  for (let i = 0; i < 6; i++){
    const px = a.x + wrap(i * 181 + t * 45, a.w + 60) - 30;
    const py = ground - 210 - (i * 37) % 120 + Math.sin(t * 2 + i) * 10;
    vx.save();
    vx.translate(px, py);
    vx.rotate(Math.sin(t * 1.5 + i) * .5);
    inkShape(P.rect(-14, -9, 28, 18), INK.white, {width: 2});
    for (let k = 0; k < 3; k++) inkShape(P.line([[-9, -4 + k * 4], [9, -4 + k * 4]]), null, {width: 1});
    vx.restore();
  }
  const gents = [[60, .95, INK.line], [150, 1.05, INK.blue], [255, .9, INK.line], [360, 1, INK.purple],
    [590, 1, INK.line], [690, .92, INK.blue], [790, 1.06, INK.line], [880, .96, INK.purple]];
  let crowd = null;
  gents.forEach(([gx, gs, coat], i) => {
    const bob = Math.sin(t * 3 + i * 1.3) * 3;
    drawGent(a.x + gx, ground + 6 + bob, gs, {coat, paper: i % 2 ? Math.sin(t * 4 + i) : 0, beard: i % 3 === 0 ? "#6b4a2b" : null});
    if (i === 3) crowd = [a.x + gx, ground + 6 + bob - 142 * gs];
  });
  const nb = a.x + 478, ns = .8, arm = Math.sin(t * 5) * 10;
  inkShape(P.rect(nb - 8 * ns, ground - 36 * ns, 6 * ns, 36 * ns), INK.trousers, {width: 2});
  inkShape(P.rect(nb + 2 * ns, ground - 36 * ns, 6 * ns, 36 * ns), INK.trousers, {width: 2});
  inkShape(P.poly([[nb - 14 * ns, ground - 34 * ns], [nb - 12 * ns, ground - 80 * ns], [nb + 12 * ns, ground - 80 * ns], [nb + 14 * ns, ground - 34 * ns]]), INK.red);
  inkShape(P.line([[nb + 10 * ns, ground - 74 * ns], [nb + 34 * ns, ground - 118 * ns + arm]]), null, {width: 4});
  inkShape(P.rect(nb + 22 * ns, ground - 138 * ns + arm, 26 * ns, 32 * ns), INK.white, {width: 2});
  inkShape(P.ellipse(nb, ground - 92 * ns, 11 * ns, 12 * ns), INK.flesh, {width: 2});
  inkShape(P.ellipse(nb, ground - 102 * ns, 14 * ns, 6 * ns), INK.blue, {width: 2});
  inkShape(P.ellipse(nb, ground - 100 * ns, 8 * ns, 3 * ns), INK.line, {width: 1});
  inkShape(P.ellipse(nb, ground - 92 * ns + 6 * ns, 3 * ns, 2.5 * ns + Math.max(0, Math.sin(t * 5)) * 2), INK.line, {width: 1});
  return {PEOPLE: crowd};
}

function inkWorks(a, sp, t, pulse){
  const ground = a.y + a.h - 30;
  inkFlat(a.x, a.y, a.w, a.h, INK.wall);
  inkShape(P.round(a.x + 560, a.y + 30, 300, 220, 150), INK.sky, {width: 4});
  for (let i = 1; i < 4; i++) inkShape(P.line([[a.x + 560 + i * 75, a.y + 30], [a.x + 560 + i * 75, a.y + 250]]), null, {width: 2});
  for (let i = 1; i < 3; i++) inkShape(P.line([[a.x + 560, a.y + 30 + i * 74], [a.x + 860, a.y + 30 + i * 74]]), null, {width: 2});
  for (let i = 0; i < 3; i++){
    const gy = a.y + 18 + i * 22;
    inkShape(P.line([[a.x, gy], [a.x + a.w, gy]]), null, {width: 4});
    for (let k = 0; k < 24; k++) inkShape(P.ellipse(a.x + 20 + k * 40, gy, 2, 2), INK.white, {width: 1});
  }
  inkShape(P.rect(a.x - 5, ground, a.w + 10, 40), INK.wood, {width: 3});
  for (let k = 0; k < 12; k++) inkShape(P.line([[a.x + k * 84, ground], [a.x + k * 84 + 30, ground + 40]]), null, {width: 1.5});
  const fx = a.x + 520, fy = ground - 150, L = 560;
  for (const tx of [fx - 170, fx + 150]){
    inkShape(P.poly([[tx - 40, ground], [tx, fy + 40], [tx + 40, ground]]), INK.wood, {width: 3});
    inkShape(P.line([[tx - 24, ground - 30], [tx + 24, ground - 30]]), null, {width: 3});
  }
  drawFish(fx, fy, L, {built: .62, wheel: true});
  const wx = fx - 90, wg = fy + 84;
  inkShape(P.rect(wx - 30, wg, 12, ground - wg), INK.wood, {width: 2});
  inkShape(P.rect(wx + 18, wg, 12, ground - wg), INK.wood, {width: 2});
  for (let r = 0; r < 4; r++) inkShape(P.line([[wx - 30, wg + 20 + r * 34], [wx + 30, wg + 20 + r * 34]]), null, {width: 3});
  const ws = .85, hit = Math.sin(t * 8);
  inkShape(P.rect(wx - 8 * ws, wg - 38 * ws, 7 * ws, 38 * ws), INK.blue, {width: 2});
  inkShape(P.rect(wx + 2 * ws, wg - 38 * ws, 7 * ws, 38 * ws), INK.blue, {width: 2});
  inkShape(P.poly([[wx - 15 * ws, wg - 36 * ws], [wx - 13 * ws, wg - 90 * ws], [wx + 13 * ws, wg - 90 * ws], [wx + 15 * ws, wg - 36 * ws]]), INK.white);
  inkShape(P.ellipse(wx, wg - 102 * ws, 11 * ws, 12 * ws), INK.flesh, {width: 2});
  inkShape(P.ellipse(wx, wg - 112 * ws, 13 * ws, 5 * ws), INK.trousers, {width: 2});
  const hx = wx - 12, hy = wg - 80, ang = -2.2 + hit * .7;
  inkShape(P.line([[hx, hy], [hx + Math.cos(ang) * 48, hy + Math.sin(ang) * 48]]), null, {width: 4});
  inkShape(P.rect(hx + Math.cos(ang) * 48 - 12, hy + Math.sin(ang) * 48 - 8, 24, 16), INK.iron, {width: 2});
  if (hit > .85) for (let i = 0; i < 5; i++){
    const sa = -1.2 + i * .5;
    inkShape(P.line([[hx + Math.cos(ang) * 48 + Math.cos(sa) * 14, hy + Math.sin(ang) * 48 + Math.sin(sa) * 14], [hx + Math.cos(ang) * 48 + Math.cos(sa) * 30, hy + Math.sin(ang) * 48 + Math.sin(sa) * 30]]), null, {width: 2, ink: INK.yellow});
  }
  const head = drawFlin(a.x + 150, ground + 8, 1, {hat: true, point: 1, look: 1, talking: pulse.voice === "FLIN"});
  return {FLIN: head};
}

function inkMuseum(a, sp, t, pulse){
  const ground = a.y + a.h - 24;
  inkFlat(a.x, a.y, a.w, a.h, INK.curtain);
  for (let k = 0; k < 15; k++) inkShape(P.line([[a.x + 30 + k * 64, a.y + 70], [a.x + 40 + k * 64, ground]]), null, {width: 2, ink: "#5e1d1a"});
  inkShape(P.rect(a.x - 5, a.y - 5, a.w + 10, 64), INK.white, {width: 3});
  inkLetter("Barnum's Museum", a.x + a.w / 2, a.y + 28, 34);
  for (let k = 0; k < 16; k++){
    const bx = a.x + k * 58;
    inkShape(P.poly([[bx, a.y + 60], [bx + 58, a.y + 60], [bx + 29, a.y + 88 + Math.sin(t * 2 + k) * 2]]), k % 2 ? INK.blue : INK.yellow, {width: 2});
  }
  inkShape(P.rect(a.x - 5, ground, a.w + 10, 30), INK.wood, {width: 3});
  const fx = a.x + a.w / 2, fy = ground - 140, L = 720;
  inkShape(P.rect(fx - 200, fy + 60, 400, ground - fy - 60), INK.stone, {width: 3});
  for (const cx of [fx - 150, fx + 150]) inkShape(P.poly([[cx - 40, fy + 60], [cx - 24, fy + 20], [cx + 24, fy + 20], [cx + 40, fy + 60]]), INK.wood, {width: 3});
  const lamp = .5 + .5 * Math.sin(t * 1.6);
  drawFish(fx, fy, L, {wheel: true, spin: t * .6, lamp});
  for (const px of [a.x + 60, a.x + a.w / 2, a.x + a.w - 60]) inkShape(P.rect(px - 5, ground - 90, 10, 90), INK.brass, {width: 2});
  for (const [x1, x2] of [[a.x + 60, a.x + a.w / 2], [a.x + a.w / 2, a.x + a.w - 60]])
    inkShape(g => { g.moveTo(x1, ground - 86); g.quadraticCurveTo((x1 + x2) / 2, ground - 60, x2, ground - 86); }, null, {width: 4, ink: INK.red});
  for (let k = 0; k < 13; k++){
    const hx = a.x + 20 + k * 74 + (k % 2) * 12;
    const bob = Math.sin(t * 2.2 + k) * 3;
    const hy = ground + 40 + bob;
    if (k % 3 === 1){
      inkShape(P.ellipse(hx, hy - 60, 26, 30), INK.line);
      inkShape(P.ellipse(hx, hy - 78, 34, 14), k % 2 ? INK.purple : INK.blue, {width: 2});
    } else {
      inkShape(P.ellipse(hx, hy - 60, 24, 26), INK.line);
      inkShape(P.rect(hx - 20, hy - 120, 40, 42), INK.line, {width: 2});
      inkShape(P.rect(hx - 30, hy - 82, 60, 6), INK.line, {width: 2});
    }
  }
  return {};
}

function inkBanquet(a, sp, t, pulse){
  const ground = a.y + a.h - 10;
  let gallery = null;
  inkFlat(a.x, a.y, a.w, a.h, INK.cloth);
  inkFlat(a.x, a.y, a.w, 150, INK.wall);
  for (let k = 0; k < 6; k++){
    const ax = a.x + 40 + k * 152;
    inkShape(g => { g.moveTo(ax, a.y + 150); g.lineTo(ax, a.y + 60); g.arc(ax + 56, a.y + 60, 56, Math.PI, 0); g.lineTo(ax + 112, a.y + 150); }, INK.purple, {width: 3});
    drawLady(ax + 56, a.y + 150, .7, {gown: k % 2 ? INK.red : INK.blue, jewel: t * 3 + k * 1.7});
    if (k === 1) gallery = [ax + 56, a.y + 74];
  }
  inkShape(P.rect(a.x - 5, a.y + 148, a.w + 10, 14), INK.stone, {width: 3});
  for (let k = 0; k < 30; k++) inkShape(P.rect(a.x + 10 + k * 32, a.y + 120, 8, 30), INK.stone, {width: 1.5});
  const cx = a.x + a.w / 2, cy = a.y + 215;
  inkShape(P.line([[cx, a.y + 162], [cx, cy - 30]]), null, {width: 3});
  inkShape(P.ellipse(cx, cy, 120, 22), INK.brass, {width: 3});
  for (let k = 0; k < 9; k++){
    const fxp = cx - 100 + k * 25, fl = 10 + Math.sin(t * 9 + k * 2) * 3;
    inkShape(P.rect(fxp - 3, cy - 24, 6, 20), INK.white, {width: 1.5});
    inkShape(P.ellipse(fxp, cy - 30, 4, fl), INK.yellow, {width: 1.5});
  }
  const guests = [[90, INK.line], [210, INK.blue], [330, INK.line], [630, INK.line], [750, INK.purple], [870, INK.line]];
  guests.forEach(([gx, coat], i) => drawGent(a.x + gx, ground + 30, 1, {coat, beard: i % 2 ? "#6b4a2b" : null}));
  const flinTalks = pulse.voice === "FLIN";
  const head = drawFlin(a.x + 480, ground - 10, 1.05, {talking: flinTalks, look: 0, point: flinTalks ? 1 : 0});
  const ty = ground - 60;
  inkShape(P.poly([[a.x - 5, ty + 90], [a.x + 60, ty], [a.x + a.w - 60, ty], [a.x + a.w + 5, ty + 90]]), INK.white);
  for (let k = 0; k < 9; k++){
    const px = a.x + 90 + k * 98;
    inkShape(P.ellipse(px, ty + 22, 28, 9), INK.white, {width: 2});
    if (k % 3 === 1){
      inkShape(P.rect(px + 40, ty - 40, 14, 56), INK.coat, {width: 2});
      inkShape(P.rect(px + 44, ty - 52, 6, 14), INK.coat, {width: 2});
    }
    if (k % 3 === 2) inkShape(P.ellipse(px - 30, ty + 6, 16, 20), INK.brass, {width: 2});
  }
  return {FLIN: head, PEOPLE: gallery};
}

function inkStreetsNight(a, sp, t, pulse){
  const ground = a.y + a.h - 34;
  inkFlat(a.x, a.y, a.w, a.h, INK.night);
  for (let i = 0; i < 24; i++) inkShape(P.ellipse(a.x + (i * 173) % a.w, a.y + 20 + (i * 61) % 160, 1.5, 1.5), INK.white, {width: 1});
  inkShape(g => { g.arc(a.x + 780, a.y + 80, 44, .9, 5.4); g.arc(a.x + 800, a.y + 72, 40, 5.1, 1.2, true); }, INK.yellow, {width: 3});
  const blocks = [[-10, 240], [110, 320], [230, 200], [340, 360], [470, 260], [590, 330], [700, 220], [820, 300]];
  for (const [bx, bh] of blocks){
    inkShape(P.rect(a.x + bx, ground - bh, 118, bh), "#2c3140");
    for (let r = 0; r < Math.floor((bh - 20) / 46); r++) for (let c = 0; c < 3; c++){
      const lit = ((bx + r * 7 + c * 13) % 11) < 3;
      inkShape(P.rect(a.x + bx + 20 + c * 32, ground - bh + 20 + r * 46, 18, 26), lit ? INK.yellow : "#1d2130", {width: 1.5});
    }
  }
  inkShape(P.rect(a.x - 5, ground, a.w + 10, 44), "#3a3a44", {width: 3});
  for (const lx of [a.x + 200, a.x + 700]){
    const fl = 1 + Math.sin(t * 11 + lx) * .15;
    for (let i = 0; i < 12; i++){
      const ang = i * Math.PI / 6 + Math.PI / 12;
      inkShape(P.line([[lx + Math.cos(ang) * 30, ground - 185 + Math.sin(ang) * 36], [lx + Math.cos(ang) * (44 + (i % 2) * 10) * fl, ground - 185 + Math.sin(ang) * (52 + (i % 2) * 10) * fl]]), null, {width: 2, ink: INK.yellow});
    }
    inkShape(P.rect(lx - 4, ground - 160, 8, 160), INK.line, {width: 2});
    inkShape(P.poly([[lx - 16, ground - 160], [lx + 16, ground - 160], [lx + 12, ground - 210], [lx - 12, ground - 210]]), INK.white, {width: 2.5});
    inkShape(P.ellipse(lx, ground - 184, 5, 9 * fl), INK.yellow, {width: 1.5});
  }
  for (let i = 0; i < 5; i++){
    const gx = a.x + wrap(i * 205 + 60 - t * 28, a.w + 80) - 40;
    drawGent(gx, ground + 6 + Math.sin(t * 6 + i) * 2, 1, {coat: i % 2 ? INK.blue : INK.line});
  }
  return {};
}

const INK_SCENES = {city: inkCityMorning, chamber: inkWorks, hall: inkBanquet};

function inkSceneFor(scene){
  if (scene.id === "chamber" && scene.hits.crowd) return inkMuseum;
  if (scene.id === "city" && !scene.hits.crowd) return inkStreetsNight;
  const fn = INK_SCENES[scene.id];
  if (!fn) throw new Error("No inked drawing for scene '" + scene.id + "' in chapter " + chapters[cur].n);
  return fn;
}

function drawInk(){
  const W = viz.width, H = viz.height;
  const t = au.currentTime || 0;
  const cue = cueIdx >= 0 ? cues[cueIdx] : null;
  const scene = sceneAt();
  const playing = !au.paused && !au.ended;
  const start = cues.length ? cues[Math.min(scene.cue, cues.length - 1)].start : 0;
  const end = scene.next && cues.length ? cues[Math.min(scene.next.cue, cues.length - 1)].start : (au.duration || start + 1);
  const sp = clamp((t - start) / Math.max(1, end - start), 0, 1);
  const voice = cue && cue.voice !== "NARRATOR" && playing ? cue.voice : null;

  vx.setTransform(1, 0, 0, 1, 0, 0);
  vx.fillStyle = inkPaperPattern();
  vx.fillRect(0, 0, W, H);
  const m = 22, capH = 62;
  const box = {x: m, y: m, w: W - 2 * m, h: H - 2 * m};
  const area = {x: box.x, y: box.y, w: box.w, h: box.h - capH};

  vx.save();
  vx.beginPath();
  vx.rect(area.x, area.y, area.w, area.h);
  vx.clip();
  const anchors = inkSceneFor(scene)(area, sp, t, {voice});
  if (voice && anchors[voice]) drawBalloon(cue.text, anchors[voice][0], anchors[voice][1], area);
  vx.restore();

  inkFlat(box.x, area.y + area.h, box.w, capH, INK.white);
  const capFont = "bold 20px Georgia, serif";
  const lines = inkWrap(scene.note.toUpperCase(), box.w - 60, capFont).slice(0, 2);
  vx.font = capFont;
  vx.textAlign = "center";
  vx.textBaseline = "middle";
  vx.fillStyle = INK.line;
  lines.forEach((l, i) => vx.fillText(l, W / 2, area.y + area.h + capH / 2 + (i - (lines.length - 1) / 2) * 24));
  inkShape(P.line([[box.x, area.y + area.h], [box.x + box.w, area.y + area.h]]), null, {width: 4});
  inkShape(P.rect(box.x, box.y, box.w, box.h), null, {width: 6});
  inkShape(P.rect(box.x + 8, box.y + 8, box.w - 16, box.h - 16), null, {width: 1.5});

  const progress = au.duration ? clamp(t / au.duration, 0, 1) : 0;
  inkFlat(box.x, box.y + box.h + 6, Math.round(progress * box.w), 4, INK.red);
}

function drawViz(){
  const ink = chapters.length > 0 && chapters[cur].n === 2;
  if (ink && viz.width !== INK_W){ viz.width = INK_W; viz.height = INK_H; }
  if (!ink && viz.width !== 96){ viz.width = 96; viz.height = 54; }
  viz.classList.toggle("ink", ink);
  if (ink){
    drawInk();
    requestAnimationFrame(drawViz);
    return;
  }
  const w = viz.width, h = viz.height;
  const t = au.currentTime || 0;
  const cue = cueIdx >= 0 ? cues[cueIdx] : null;
  const scene = sceneAt();
  const characters = scene.characters;
  const voice = cue ? cue.voice : "NARRATOR";
  const accent = voiceRgb(voice);
  const pale = tint(accent, .56, [232, 226, 212]);
  const warm = tint(accent, .35, [201, 162, 39]);
  const deep = tint(accent, .14, [8, 7, 6]);
  const stone = tint(accent, .09, [36, 31, 26]);
  const shadow = tint(stone, .28, [6, 5, 4]);
  const spark = tint(accent, .72, [255, 247, 206]);
  const playing = !au.paused && !au.ended;
  const cueLen = cue ? cue.text.length : 40;
  const marks = cue ? (cue.text.match(/[!?;,]/g) || []).length : 0;
  const cueSpan = cue ? Math.max(.25, cue.end - cue.start) : 1;
  const cueProgress = cue ? clamp((t - cue.start) / cueSpan, 0, 1) : 0;
  const intensity = clamp(cueLen / 110 + marks * .08, .22, 1.1);
  const pulse = playing ? Math.sin(t * (1.2 + intensity)) * .5 + .5 : .18;
  const drift = playing ? t * (1 + intensity * .8) : t * .2;

  if (cueIdx !== vizState.lastCue){
    vizState.flash = 1;
    vizState.lastCue = cueIdx;
  }
  if (scene.id !== vizState.lastScene){
    vizState.flash = 1;
    vizState.lastScene = scene.id;
  }
  vizState.flash *= playing ? .9 : .84;

  rect(0, 0, w, h, rgba(deep));
  drawScene(scene, characters, t, pulse, drift, cueProgress, accent, pale, warm, deep, stone, shadow, spark, intensity);
  drawCharacters(characters, scene.id, cue && cue.voice !== "NARRATOR" ? cue.voice : characters[0], accent, pulse);

  if (vizState.flash > .08) rect(0, 0, w, 2, rgba(spark, vizState.flash * .35));

  const progress = au.duration ? clamp(au.currentTime / au.duration, 0, 1) : 0;
  rect(0, h - 1, w, 1, rgba([34, 29, 24]));
  rect(0, h - 1, Math.max(1, Math.round(progress * w)), 1, rgba(warm));
  drawFrame(accent, pale);

  requestAnimationFrame(drawViz);
}
const save = () => {
  if (!chapters.length) return;
  try {
    localStorage.setItem(KEY, JSON.stringify(
      {n: chapters[cur].n, t: au.currentTime, rate: au.playbackRate}));
  } catch (e) {}
};
const load = () => {
  try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { return null; }
};

function buildCast(){
  const box = document.getElementById("cast");
  for (const id in NAMES){
    const s = document.createElement("span");
    const dot = document.createElement("i");
    dot.style.background = colour(id);
    s.appendChild(dot);
    s.appendChild(document.createTextNode(NAMES[id]));
    box.appendChild(s);
  }
}

function renderScript(){
  const box = document.getElementById("script");
  box.innerHTML = "";
  if (!cues.length){
    box.innerHTML = '<p style="color:var(--ink-faint)">Transcript unavailable for this chapter.</p>';
    return;
  }
  let blk = null, blkVoice = null;
  cues.forEach((c, i) => {
    if (c.voice !== blkVoice){
      blk = document.createElement("div");
      blk.className = "blk" + (c.voice === "NARRATOR" ? "" : " speech");
      blk.style.color = colour(c.voice);
      if (c.voice !== "NARRATOR"){
        const who = document.createElement("b");
        who.className = "who";
        who.textContent = NAMES[c.voice] || c.voice;
        blk.appendChild(who);
      }
      const line = document.createElement("p");
      line.className = "line";
      line.style.margin = "0";
      blk.appendChild(line);
      box.appendChild(blk);
      blkVoice = c.voice;
    }
    const s = document.createElement("span");
    s.className = "s";
    s.textContent = c.text + " ";
    s.dataset.i = i;
    s.addEventListener("click", () => { au.currentTime = c.start + 0.01; au.play(); });
    blk.querySelector(".line").appendChild(s);
  });
}

function highlight(){
  if (!cues.length) return;
  const t = au.currentTime;
  let i = cueIdx;
  if (i < 0 || t < cues[i].start || t > cues[i].end){
    i = cues.findIndex(c => t >= c.start && t <= c.end);
    if (i < 0) return;
  }
  if (i === cueIdx) return;
  cueIdx = i;
  const box = document.getElementById("script");
  const prevCur = box.querySelector("span.cur");
  if (prevCur) prevCur.classList.remove("cur");
  const prevBlk = box.querySelector(".blk.now");
  if (prevBlk) prevBlk.classList.remove("now");
  const span = box.querySelector('span[data-i="' + i + '"]');
  if (!span) return;
  span.classList.add("cur");
  const blk = span.closest(".blk");
  if (blk) blk.classList.add("now");

  const sp = document.getElementById("sp");
  sp.textContent = cues[i].voice === "NARRATOR" ? "" : (NAMES[cues[i].voice] || cues[i].voice);
  sp.style.color = colour(cues[i].voice);
  vizState.flash = 1;

  const r = span.getBoundingClientRect();
  const stageBottom = document.querySelector(".stage").getBoundingClientRect().bottom;
  if (r.top < stageBottom + 20 || r.bottom > window.innerHeight - 140)
    window.scrollTo({top: window.scrollY + r.top - stageBottom - 40, behavior: "smooth"});
}

async function openChapter(i, seekTo, autoplay){
  cur = i;
  cueIdx = -1;
  vizState.flash = 1;
  vizState.lastCue = -2;
  const c = chapters[i];
  const id = pad(c.n);
  document.getElementById("ct").textContent = c.title;
  document.getElementById("cm").textContent =
    "Chapter " + c.n + " of " + chapters.length + " · " + c.words.toLocaleString() + " words";
  document.getElementById("nt").textContent = c.n + ". " + c.title;
  document.getElementById("sp").textContent = "";
  document.querySelectorAll("#toc li").forEach((li, k) => li.classList.toggle("on", k === i));
  au.src = "audio/ch" + id + ".mp3";
  document.getElementById("script").innerHTML =
    '<p style="color:var(--ink-faint)">Loading&hellip;</p>';
  cues = [];
  try {
    const r = await fetch("audio/ch" + id + ".json");
    if (r.ok) cues = (await r.json()).cues || [];
  } catch (e) {}
  renderScript();
  if (seekTo > 0){
    const seekWhenReady = () => { au.currentTime = seekTo; };
    if (au.readyState > 0) seekWhenReady();
    else au.addEventListener("loadedmetadata", seekWhenReady, {once: true});
  }
  if (autoplay) au.play();
  save();
}

function buildTOC(){
  const ol = document.getElementById("toc");
  chapters.forEach((c, i) => {
    const li = document.createElement("li");
    const b = document.createElement("button");
    const num = document.createElement("span");
    num.className = "num";
    num.textContent = c.n;
    const t = document.createElement("span");
    t.textContent = c.title;
    b.appendChild(num);
    b.appendChild(t);
    b.addEventListener("click", () => openChapter(i, 0, true));
    li.appendChild(b);
    ol.appendChild(li);
  });
}

document.getElementById("play").onclick = () => au.paused ? au.play() : au.pause();
document.getElementById("prev").onclick = () => { if (cur > 0) openChapter(cur - 1, 0, true); };
document.getElementById("next").onclick = () => {
  if (cur < chapters.length - 1) openChapter(cur + 1, 0, true);
};
document.getElementById("b15").onclick = () => au.currentTime = Math.max(0, au.currentTime - 15);
document.getElementById("f15").onclick = () =>
  au.currentTime = Math.min(au.duration || 0, au.currentTime + 15);
document.getElementById("rate").onchange = e => { au.playbackRate = +e.target.value; save(); };

const seek = document.getElementById("seek");
let scrubbing = false;
seek.oninput = () => { scrubbing = true; };
seek.onchange = () => {
  if (au.duration) au.currentTime = (seek.value / 1000) * au.duration;
  scrubbing = false;
};

au.onplay = () => document.getElementById("play").textContent = "Pause";
au.onpause = () => { document.getElementById("play").textContent = "Play"; save(); };
au.ontimeupdate = () => {
  document.getElementById("tm").textContent = fmt(au.currentTime) + " / " + fmt(au.duration);
  if (!scrubbing && au.duration) seek.value = (au.currentTime / au.duration) * 1000;
  highlight();
};
au.onended = () => {
  document.querySelectorAll("#toc li")[cur].classList.add("done");
  if (cur < chapters.length - 1) openChapter(cur + 1, 0, true);
};
au.onerror = () => {
  document.getElementById("script").innerHTML =
    '<p style="color:#d98b8b">Chapter ' + chapters[cur].n +
    ' could not be loaded from audio/ch' + pad(chapters[cur].n) + '.mp3</p>';
};
setInterval(save, 5000);

document.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
  if (e.code === "Space"){ e.preventDefault(); au.paused ? au.play() : au.pause(); }
  if (e.code === "ArrowLeft") au.currentTime = Math.max(0, au.currentTime - 15);
  if (e.code === "ArrowRight") au.currentTime = Math.min(au.duration || 0, au.currentTime + 15);
});

buildCast();
drawViz();
Promise.all(["chapters.json", "scenes.json"].map(f =>
  fetch(f).then(r => {
    if (!r.ok) throw new Error(f + " returned HTTP " + r.status);
    return r.json();
  })))
  .then(([js, sc]) => {
    for (const c of js){
      if (!Array.isArray(sc[c.n]) || !sc[c.n].length)
        throw new Error("scenes.json has no scenes for chapter " + c.n);
    }
    chapters = js;
    scenes = sc;
    buildTOC();
    const p = load();
    let i = 0;
    if (p){
      const k = chapters.findIndex(c => c.n === p.n);
      if (k >= 0) i = k;
      if (p.rate){
        au.playbackRate = p.rate;
        document.getElementById("rate").value = p.rate;
      }
    }
    openChapter(i, p ? p.t : 0, false);
  })
  .catch(err => {
    document.getElementById("script").innerHTML =
      '<p style="color:#d98b8b">Could not load the book: ' + err.message +
      '. Serve this folder over HTTP (python -m http.server 8000) instead of opening the file directly.</p>';
  });
</script>
